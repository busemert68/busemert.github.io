<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buse Mert | Kişisel Web Sitesi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #16213e;
            border: 1px solid #0f3460;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 450px;
            text-align: center;
            width: 90%;
        }
        h1 {
            color: #e94560;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        p {
            color: #a2a8d3;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .btn {
            display: inline-block;
            background-color: #e94560;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #0f3460;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Hoş Geldiniz! ✨</h1>
        <p>Merhaba, ben Buse. Satış Wen Siteme Hoşgeldin.</p>
        <a href="https://github.com/busemert68" target="_blank" class="btn">GitHub Profilim</a>
    </div>

</body>
</html>
